# CI for hytest.
#
# `build` compiles everything that can be checked without a Hytale account.
# `integration` boots a real Hytale server and runs the example suite, which
# requires downloading the server + Assets from maven.hytale.com through
# hygradle's provisionServer, authenticated by a cached `auth:server` token
# that HytaleAuth refreshes in ~/.local/share/hygradle/token.json (downloader
# scope) — session tokens are optional; see GameSession.kt.
# That token is a repository secret (HYTALE_TOKEN_JSON), so the job only does
# real work when the secret is present — forks and PRs from forks stay green.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (runtime, junit5, gradle plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build

  integration:
    name: Integration (example suite on a real server)
    needs: build
    # No PRs: the Hytale token secret is not visible to fork PRs anyway, and
    # pushes to other branches opt in via workflow_dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      # Rotation chain: restore the LATEST cached token (keyed by run id so
      # every run saves a fresh entry; restore-keys falls back to the newest
      # previous one). Without this, a run that refreshes its access token
      # would orphan the secret's refresh token and break every later run.
      - name: Restore Hytale token
        uses: actions/cache@v4
        with:
          path: ~/.local/share/hygradle/token.json
          key: hytale-downloader-token-${{ github.run_id }}
          restore-keys: |
            hytale-downloader-token-

      # The `secrets` context is not available in step/job `if:` conditions,
      # so the standard workaround is to mirror the secret into an env var of
      # a sentinel step and gate the real steps on that step's output. The job
      # itself always runs on push-to-main/dispatch; without the secret it
      # succeeds with a notice instead of silently skipping.
      - name: Check for server auth token
        id: token
        env:
          HYTALE_TOKEN_JSON: ${{ secrets.HYTALE_TOKEN_JSON }}
        run: |
          if [ -n "$HYTALE_TOKEN_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HYTALE_TOKEN_JSON is not set — skipping the server integration suite."
          fi

      # The DOWNLOADER token (token.json, OAuth client "hytale-downloader")
      # is what the integration job's hard requirement — provisionServer —
      # authenticates with to fetch the server + Assets. Expired access
      # tokens auto-refresh from its refresh_token
      # (HytaleAuth.getAccessToken), so the secret only needs manual renewal
      # if the refresh token itself is rejected. The SESSION token
      # (token-server.json) is optional: GameSession fail-softs and the
      # server runs without it — every local run to date has been
      # session-tokenless and green. Same printf shape GameSession documents,
      # in case a server-scoped token is added later.
      - name: Install hygradle downloader token
        if: steps.token.outputs.present == 'true'
        env:
          HYTALE_TOKEN_JSON: ${{ secrets.HYTALE_TOKEN_JSON }}
        run: |
          mkdir -p "$HOME/.local/share/hygradle"
          # Seed ONLY when the rotation chain had no cached token (first run,
          # cache eviction). Overwriting a restored token here would clobber
          # the newest rotated refresh token and break the chain.
          if [ ! -s "$HOME/.local/share/hygradle/token.json" ]; then
            printf '%s' "$HYTALE_TOKEN_JSON" > "$HOME/.local/share/hygradle/token.json"
            echo "seeded token.json from HYTALE_TOKEN_JSON"
          else
            echo "token.json restored from cache — keeping the latest rotated token"
          fi

      - name: Example integration suite
        if: steps.token.outputs.present == 'true'
        run: ./gradlew -p example hytaleTest
