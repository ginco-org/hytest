# CI for hytest.
#
# `build` compiles everything that can be checked without a Hytale account.
# `integration` boots a real Hytale server and runs the example suite, which
# requires downloading the server + Assets from maven.hytale.com through
# hygradle's provisionServer, authenticated by a cached `auth:server` token
# that GameSession.kt reads from ~/.local/share/hygradle/token-server.json.
# That token is a repository secret (HYTALE_TOKEN_JSON), so the job only does
# real work when the secret is present — forks and PRs from forks stay green.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (runtime, junit5, gradle plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build

  integration:
    name: Integration (example suite on a real server)
    needs: build
    # No PRs: the Hytale token secret is not visible to fork PRs anyway, and
    # pushes to other branches opt in via workflow_dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      # The `secrets` context is not available in step/job `if:` conditions,
      # so the standard workaround is to mirror the secret into an env var of
      # a sentinel step and gate the real steps on that step's output. The job
      # itself always runs on push-to-main/dispatch; without the secret it
      # succeeds with a notice instead of silently skipping.
      - name: Check for server auth token
        id: token
        env:
          HYTALE_TOKEN_JSON: ${{ secrets.HYTALE_TOKEN_JSON }}
        run: |
          if [ -n "$HYTALE_TOKEN_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HYTALE_TOKEN_JSON is not set — skipping the server integration suite."
          fi

      # Exactly the path and JSON shape GameSession.kt expects: it regex-reads
      # "access_token" and "expires_at" from this file. Written with printf so
      # the secret lands in the file byte-for-byte without a trailing newline
      # added by echo.
      - name: Install hygradle server token
        if: steps.token.outputs.present == 'true'
        env:
          HYTALE_TOKEN_JSON: ${{ secrets.HYTALE_TOKEN_JSON }}
        run: |
          mkdir -p "$HOME/.local/share/hygradle"
          printf '%s' "$HYTALE_TOKEN_JSON" > "$HOME/.local/share/hygradle/token-server.json"

      - name: Example integration suite
        if: steps.token.outputs.present == 'true'
        run: ./gradlew -p example hytaleTest
