name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing credentials are visible (non-leaking)
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]; then
            echo "signingInMemoryKey: MISSING (org secret not accessible to this repo)"
          else
            echo "signingInMemoryKey: present, $(printf %s "$ORG_GRADLE_PROJECT_signingInMemoryKey" | wc -l) lines, starts with: $(printf %s "$ORG_GRADLE_PROJECT_signingInMemoryKey" | head -c 36)"
          fi
          if [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ]; then
            echo "mavenCentralUsername: MISSING"
          else
            echo "mavenCentralUsername: present"
          fi

      - name: Publish
        run: ./gradlew publishAllPublicationsToMavenCentralRepository
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
